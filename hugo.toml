baseURL = "https://johndschultz.com/"
languageCode = "en-us"
title = "John Schultz"
theme = "PaperMod"
[pagination]
  pagerSize = 10
timeZone = "America/Chicago"

enableRobotsTXT = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[taxonomies]
  tag = "tags"
  series = "series"

[outputs]
  home = ["HTML", "RSS", "JSON", "LLMS"]

[outputFormats]
  [outputFormats.LLMS]
    mediaType = "text/plain"
    baseName = "llms"
    isPlainText = true
    notAlternative = true

[mediaTypes]
  [mediaTypes."text/plain"]
    suffixes = ["txt"]

# Noindex + drop thin taxonomy term pages from sitemap
[[cascade]]
  [cascade.target]
    kind = "term"
  [cascade.params]
    robotsNoIndex = true
  [cascade.sitemap]
    disable = true

[[cascade]]
  [cascade.target]
    kind = "taxonomy"
  [cascade.params]
    robotsNoIndex = true
  [cascade.sitemap]
    disable = true

[params]
  author = "John Schultz"
  description = "Essays and ideas from John Schultz: Partner and CMTO at Grafe Auction, past NAA President and Board Chair, on auctions, technology, and leadership."
  env = "production"
  defaultTheme = "auto"
  # Default Open Graph / Twitter image (site-wide fallback)
  images = ["images/og-default.jpg"]
  keywords = ["John Schultz", "auction", "auctioneer", "Grafe Auction", "AI", "leadership", "marketing", "technology"]
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false
  ShowWordCount = false
  ShowFullTextinRSS = true
  UseHugoToc = true
  displayFullLangName = true

  # Person schema (PaperMod home + publisher on posts)
  [params.schema]
    publisherType = "Person"
    sameAs = [
      "https://www.linkedin.com/in/jdschultz/",
      "https://grafeauction.com"
    ]

  [[params.socialIcons]]
    name = "email"
    url = "mailto:john.schultz@grafeauction.com"

  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/jdschultz/"

  [[params.socialIcons]]
    name = "rss"
    url = "https://johndschultz.com/index.xml"

  [params.assets]
    theme_color = "#F2F0E5"

  [params.profileMode]
    enabled = true
    title = "John Schultz"
    subtitle = "Auctioneer. Technologist. Writer."
    imageUrl = "images/john-schultz.jpg"
    imageTitle = "John Schultz"
    imageWidth = 120
    imageHeight = 120

  [params.cover]
    linkFullImages = true

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]

[[menu.main]]
  identifier = "essays"
  name = "Essays"
  url = "/essays/"
  weight = 10

[[menu.main]]
  identifier = "thoughts"
  name = "Thought Cards"
  url = "/thoughts/"
  weight = 20

[[menu.main]]
  identifier = "concepts"
  name = "Concepts"
  url = "/concepts/"
  weight = 25

[[menu.main]]
  identifier = "speaking"
  name = "Speaking"
  url = "/speaking/"
  weight = 30

[[menu.main]]
  identifier = "about"
  name = "About"
  url = "/about/"
  weight = 40

[[menu.main]]
  identifier = "search"
  name = "Search"
  url = "/search/"
  weight = 50

[[menu.main]]
  identifier = "tags"
  name = "Tags"
  url = "/tags/"
  weight = 60
